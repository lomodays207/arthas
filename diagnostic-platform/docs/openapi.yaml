openapi: 3.1.0
info:
  title: Diagnostic Platform API
  version: 0.1.0
  description: Session, typed diagnostic task, event replay and edge delivery API.
security:
  - bearerToken: []
paths:
  /api/v1/me:
    get:
      operationId: getPrincipal
      responses:
        '200': {description: Authenticated identity and role}
  /api/v1/assets:
    get:
      operationId: listVisibleAssets
      responses:
        '200': {description: Assets visible to this principal}
    post:
      operationId: registerAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, appId, environmentName, zoneId, agentId, displayName, members]
              additionalProperties: false
              properties:
                assetId: {type: string}
                appId: {type: string}
                environmentName: {type: string}
                zoneId: {type: string}
                agentId: {type: string}
                displayName: {type: string}
                members: {type: array, items: {type: string}}
      responses:
        '201': {description: Asset created}
  /api/v1/assets/{id}/jvms:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listRegisteredTargets
      responses:
        '200': {description: Visible registered targets}
    post:
      operationId: registerTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, fingerprint, javaFeature]
              additionalProperties: false
              properties:
                targetId: {type: string}
                fingerprint: {type: string}
                javaFeature: {type: integer, minimum: 8}
      responses:
        '201': {description: Target registered}
  /api/v1/grants:
    get:
      operationId: listGrants
      responses:
        '200': {description: Latest 200 visible grants ordered by expiry}
    post:
      operationId: requestGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, capabilities, ticketId, requestedUntil]
              additionalProperties: false
              properties:
                targetId: {type: string}
                capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
                ticketId: {type: string}
                requestedUntil: {type: integer, description: Expiry in Unix milliseconds}
      responses:
        '201': {description: Pending grant created}
  /api/v1/grants/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getGrant
      responses:
        '200': {description: Current grant and revision}
  /api/v1/grants/{id}/decisions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: decideGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, decision, reasonCode, expectedRevision]
              additionalProperties: false
              properties:
                eventId: {type: string}
                decision: {enum: [APPROVE, DENY, REVOKE]}
                reasonCode: {type: string}
                expectedRevision: {type: integer, minimum: 1}
      responses:
        '200': {description: Grant after the decision}
        '409': {description: Revision or duplicate event conflict}
  /api/v1/sessions:
    post:
      operationId: openSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetId, grantId]
              properties:
                targetId: {type: string}
                grantId: {type: string, format: uuid}
      responses:
        '202':
          description: Session accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '403': {description: Grant unavailable for this principal or target}
        '409': {description: Target generation unavailable}
  /api/v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getSession
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
    delete:
      operationId: closeSession
      responses:
        '200': {description: Session closed; target cleanup is asynchronous}
  /api/v1/sessions/{id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: renewSession
      responses:
        '200': {description: Session extended within grant expiry}
  /api/v1/sessions/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: submitTask
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capability]
              properties:
                capability: {$ref: '#/components/schemas/Capability'}
                criteria: {$ref: '#/components/schemas/Criteria'}
      responses:
        '202':
          description: Task accepted or matching prior task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '409': {description: Session not ready or target occupied}
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTask
      responses:
        '200':
          description: Confirmed task state and permitted snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '403': {description: Task or grant not available to this principal}
  /api/v1/tasks/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: streamTaskEvents
      parameters:
        - {name: Last-Event-ID, in: header, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: SSE stream of durable task state events in sequence order}
        '403': {description: Grant denied}
        '429': {description: Subscriber capacity reached}
  /api/v1/tasks/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: requestCancellation
      responses:
        '202': {description: Cancellation accepted}
  /api/v1/edge/claims:
    post:
      operationId: claimOperation
      responses:
        '200': {description: Operation bound to the authenticated executor}
        '204': {description: No eligible operation}
  /api/v1/edge/operations/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: completeOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [leaseToken, completion]
              properties:
                leaseToken: {type: string, format: uuid}
                completion: {enum: [ATTACHED, DONE, STOPPED, RELEASED, FAILED, UNKNOWN, TARGET_GONE]}
                result: {$ref: '#/components/schemas/Snapshot'}
                evidence: {$ref: '#/components/schemas/Evidence'}
      responses:
        '204': {description: Completion recorded}
        '409': {description: Lease, generation, operation state or completion conflict}
  /api/v1/audit/events:
    get:
      operationId: listTargetAudit
      parameters:
        - name: targetId
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Audit events for the target}
  /api/v1/edge/targets/{id}/generations/{generation}/released:
    parameters:
      - $ref: '#/components/parameters/Id'
      - {name: generation, in: path, required: true, schema: {type: integer}}
    post:
      operationId: confirmLocalRelease
      responses:
        '204': {description: Generation reconciled or already superseded}
  /api/v1/management/channels:
    get:
      operationId: listAgentChannels
      responses:
        '200': {description: Agent identity, last poll and online status}
  /api/v1/management/cleanup:
    get:
      operationId: listCleanupAlerts
      responses:
        '200': {description: Targets draining or awaiting reconciliation}
  /api/v1/assets/{id}/policy:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: readAssetPolicy
      responses:
        '200': {description: Current policy and revision}
    put:
      operationId: updateAssetPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, paused, maxSessions]
              properties:
                expectedRevision: {type: integer}
                paused: {type: boolean}
                maxSessions: {type: integer, minimum: 1, maximum: 128}
      responses:
        '200': {description: Updated policy}
        '409': {description: Policy revision changed}
  /api/v1/tasks/{id}/references:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: shareEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [readerId,expiresAt]
              properties:
                readerId: {type: string}
                expiresAt: {type: integer}
      responses:
        '200': {description: Reference granted to selected identity}
  /api/v1/references/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: readEvidence
      responses:
        '200': {description: Authorized result}
        '403': {description: No effective permission}
    delete:
      operationId: revokeEvidence
      responses:
        '200': {description: Reference revoked}

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
  securitySchemes:
    bearerToken: {type: http, scheme: bearer}
  schemas:
    Session:
      type: object
      required: [sessionId, targetId, grantId, state, generation, expiresAt]
      properties:
        sessionId: {type: string, format: uuid}
        targetId: {type: string}
        grantId: {type: string, format: uuid}
        actorId: {type: string}
        state: {enum: [OPENING, ACTIVE, CLOSED, EXPIRED, REVOKED, TARGET_GONE]}
        generation: {type: integer}
        expiresAt: {type: integer}
    Task:
      type: object
      required: [taskId, targetId, capability, state, generation, deadlineAt]
      properties:
        taskId: {type: string, format: uuid}
        targetId: {type: string}
        capability: {$ref: '#/components/schemas/Capability'}
        state:
          enum: [QUEUED, DISPATCHING, RUNNING, CANCEL_REQUESTED, RECONCILING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
        generation: {type: integer}
        deadlineAt: {type: integer}
        result:
          anyOf:
            - $ref: '#/components/schemas/Snapshot'
            - {type: 'null'}
        evidence:
          anyOf:
            - $ref: '#/components/schemas/Evidence'
            - {type: 'null'}
    Capability:
      enum: [JVM_OVERVIEW, THREAD_LIST, THREAD_DETAIL, CLASS_METHOD_LOOKUP, METHOD_WATCH, METHOD_TRACE, METHOD_STACK, METHOD_MONITOR]
    Criteria:
      type: object
      additionalProperties: false
      properties:
        threadId: {type: integer, minimum: 1}
        className: {type: string}
        methodName: {type: string}
        loader: {type: string, pattern: '^[a-f0-9]{1,8}$'}
    Evidence:
      type: object
      additionalProperties: false
      required: [coverage, sampledAt, rows]
      properties:
        coverage: {enum: [COMPLETE, PARTIAL, TRUNCATED, NO_HIT]}
        sampledAt: {type: integer, minimum: 1}
        rows: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/Observation'}}
    Observation:
      type: object
      additionalProperties: false
      properties:
        threadId: {type: integer}
        className: {type: string}
        methodName: {type: string}
        loader: {type: string}
        descriptor: {type: string}
        state: {type: string}
        costMs: {type: number}
        cpuPercent: {type: number}
        success: {type: integer}
        failed: {type: integer}
        line: {type: integer}
        depth: {type: integer}
    Snapshot:
      type: object
      additionalProperties: false
      required: [heapUsedBytes, heapCommittedBytes, nonHeapUsedBytes, uptimeMillis, threadCount]
      properties:
        heapUsedBytes: {type: integer, minimum: 0}
        heapCommittedBytes: {type: integer, minimum: 0}
        nonHeapUsedBytes: {type: integer, minimum: 0}
        uptimeMillis: {type: integer, minimum: 0}
        threadCount: {type: integer, minimum: 0}
