spring.application.name=diagnostic-platform-api
server.address=127.0.0.1
server.port=8080
management.endpoints.web.exposure.include=health
spring.datasource.url=jdbc:h2:file:./data/diagnostic-platform;MODE=MySQL
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
diagnostic.auth.admin-token=${DIAGNOSTIC_ADMIN_TOKEN:}
diagnostic.auth.approver-token=${DIAGNOSTIC_APPROVER_TOKEN:}
diagnostic.auth.operator-token=${DIAGNOSTIC_OPERATOR_TOKEN:}
diagnostic.auth.executor-token=${DIAGNOSTIC_EXECUTOR_TOKEN:}
diagnostic.auth.executor-id=${DIAGNOSTIC_EXECUTOR_ID:local-agent}
diagnostic.auth.operator2-token=${DIAGNOSTIC_OPERATOR2_TOKEN:}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
